# HostStack Configuration — camsilo.dk
# Docs: https://hoststack.dev/docs/yaml-config
#
# Next.js 15 (App Router), rent statisk one-page site — ingen database,
# ingen secrets. `next start` lytter på $PORT som HostStack injicerer.

services:
  web:
    type: web_service
    build:
      command: npm run build
    start:
      command: npm start
    port: 3000
    healthCheck:
      # Sitet har ingen /health-route — forsiden er statisk og returnerer
      # 200, så den bruges som health-gate (samme mønster som TermoCalc).
      path: /
      interval: 10
      timeout: 5
    scaling:
      min: 1
      max: 1
    env:
      NODE_ENV: production
